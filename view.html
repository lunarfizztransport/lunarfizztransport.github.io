<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lunarfizztransport · full size</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<style>
/* Layout: one collage centered on black, zoomable and draggable; a slim bevelled toolbar on top. Matches the desktop site's chrome. Deliberately one look. */
:root {
  --bg: #000000;
  --chrome: #C6C6C6;
  --chrome-hi: #FFFFFF;
  --chrome-lo: #7B7B7B;
  --chrome-dk: #0A0A0A;
  --ink: #0A0A0A;
  --ink-soft: #4A4A4A;
  --hint: #9A9A9A;
  --f-pixel: "Silkscreen", "Courier New", monospace;
  --f-label: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); overflow: hidden; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px dotted #1E3DD8; outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px; background: var(--chrome); border-bottom: 2px solid var(--chrome-dk); }
.bar h1 { flex: 1 1 200px; min-width: 0; margin: 0; font-family: var(--f-pixel); font-size: 13px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar h1 span { font-family: var(--f-label); font-size: 18px; color: var(--ink-soft); margin-left: 6px; }
.tools { display: flex; align-items: center; gap: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 30px; padding: 0 10px; background: var(--chrome); border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); box-shadow: inset -1px -1px 0 var(--chrome-lo); color: var(--ink); font-family: var(--f-label); font-size: 20px; line-height: 1; text-decoration: none; cursor: pointer; }
.btn:active { border-color: var(--chrome-dk) var(--chrome-hi) var(--chrome-hi) var(--chrome-dk); box-shadow: inset 1px 1px 0 var(--chrome-lo); }
.pct { min-width: 54px; font-family: var(--f-label); font-size: 19px; text-align: center; font-variant-numeric: tabular-nums; }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
.stage.dragging { cursor: grabbing; }
.stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; }
.hint { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 4px 10px; background: rgba(0,0,0,.7); color: var(--hint); font-family: var(--f-label); font-size: 18px; white-space: nowrap; pointer-events: none; transition: opacity .6s; }
.msg { margin: auto; padding: 24px; color: var(--hint); font-family: var(--f-label); font-size: 22px; text-align: center; }
@media (max-width: 520px) { .bar h1 span { display: none; } }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <h1 id="title">Loading…</h1>
  <div class="tools" role="group" aria-label="Zoom">
    <button type="button" class="btn" id="out" aria-label="Zoom out">−</button>
    <span class="pct" id="pct" aria-live="polite">100%</span>
    <button type="button" class="btn" id="in" aria-label="Zoom in">+</button>
    <button type="button" class="btn" id="fit">Fit</button>
    <a class="btn" href="./#collages">Back to site</a>
  </div>
</header>
<main class="stage" id="stage">
  <img id="img" alt="" draggable="false">
  <div class="hint" id="hint">Scroll or pinch to zoom · drag to move · double-click to zoom</div>
</main>
<p class="msg" id="msg" hidden>That collage couldn't be found. <a class="btn" href="./#collages">Back to the collages</a></p>

<script>
/* Opened from the collage viewer as view.html?img=images/<name>.jpg
   Shows images/full/<name>.jpg when it exists, else the regular image. */
const $ = id => document.getElementById(id);
const stage = $("stage"), img = $("img");
const param = new URLSearchParams(location.search).get("img") || "";
const path = param.replace(/^\//, "");
let scale = 1, fitScale = 1, x = 0, y = 0;

function apply() {
  img.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  $("pct").textContent = Math.round(scale * 100) + "%";
}
function clampPan() {
  const W = stage.clientWidth, H = stage.clientHeight, w = img.naturalWidth * scale, h = img.naturalHeight * scale;
  x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, x));
  y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, y));
}
function fit() {
  const W = stage.clientWidth, H = stage.clientHeight, pad = Math.min(48, W * .05);
  fitScale = Math.min((W - pad * 2) / img.naturalWidth, (H - pad * 2) / img.naturalHeight, 1);
  scale = fitScale; clampPan(); apply();
}
function zoomAt(next, cx, cy) {
  next = Math.max(fitScale * .5, Math.min(next, 6));
  x = cx - (cx - x) * (next / scale); y = cy - (cy - y) * (next / scale);
  scale = next; clampPan(); apply();
}
const center = () => [stage.clientWidth / 2, stage.clientHeight / 2];
function hideHint() { $("hint").style.opacity = 0; }

$("in").onclick = () => zoomAt(scale * 1.4, ...center());
$("out").onclick = () => zoomAt(scale / 1.4, ...center());
$("fit").onclick = fit;
stage.addEventListener("wheel", e => {
  e.preventDefault(); hideHint();
  const r = stage.getBoundingClientRect();
  zoomAt(scale * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
stage.addEventListener("dblclick", e => {
  hideHint();
  const r = stage.getBoundingClientRect();
  zoomAt(scale > fitScale * 1.05 ? fitScale : Math.max(1, fitScale * 2.5), e.clientX - r.left, e.clientY - r.top);
});

/* Drag with one pointer, pinch with two */
const pts = new Map(); let last = null, pinch = null;
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) { last = [e.clientX, e.clientY]; stage.classList.add("dragging"); }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: scale }; }
});
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]); hideHint();
  if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()], r = stage.getBoundingClientRect();
    zoomAt(pinch.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
  } else if (pts.size === 1 && last) {
    x += e.clientX - last[0]; y += e.clientY - last[1]; last = [e.clientX, e.clientY]; clampPan(); apply();
  }
});
function up(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 1) last = [...pts.values()][0]; else { last = null; stage.classList.remove("dragging"); }
}
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
document.addEventListener("keydown", e => {
  if (e.key === "+" || e.key === "=") $("in").click();
  if (e.key === "-") $("out").click();
  if (e.key === "0") fit();
});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const wasFit = Math.abs(scale - fitScale) < .001; fit(); if (!wasFit) { scale = Math.max(scale, fitScale); clampPan(); apply(); } }, 100); });

function fail() { stage.hidden = true; $("msg").hidden = false; $("title").textContent = "Not found"; }
(async function start() {
  // Only show images from this site's images folder.
  if (!/^images\/[\w\-.]+\.(jpe?g|png|webp|gif)$/i.test(path)) return fail();
  try {
    const r = await fetch("data/pieces.json?v=" + Date.now());
    const p = r.ok ? (await r.json()).find(q => String(q.image || "").replace(/^\//, "") === path) : null;
    if (p) {
      $("title").textContent = p.title || "Untitled";
      const meta = [p.year, p.size].filter(Boolean).join(" · ");
      if (meta) { const s = document.createElement("span"); s.textContent = meta; $("title").appendChild(s); }
      document.title = `${p.title || "Untitled"} · lunarfizztransport`;
      img.alt = p.title || "";
    } else $("title").textContent = "Collage";
  } catch (e) { $("title").textContent = "Collage"; }
  img.onload = () => { fit(); setTimeout(hideHint, 4000); };
  img.onerror = () => { if (img.dataset.tried) return fail(); img.dataset.tried = "1"; img.src = path; };
  img.src = path.replace(/^images\//, "images/full/");
})();
</script>
</body>
</html>
